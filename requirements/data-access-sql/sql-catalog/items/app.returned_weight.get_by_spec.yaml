id: app.returned_weight.get_by_spec
dialect: sqlite
datasource: app.sqlite
operation: read
business_meaning: 按焊丝规格查询空盘/归还重量（queryWireReturnedWeightBySpec），表镜像现场 WeldingWireMaterials。
sql: |
  SELECT empty_spool_weight AS return_weight
  FROM welding_wire_materials
  WHERE material_type = '焊丝'
    AND specification_model = :returned_wire_spec;
params:
  - name: returned_wire_spec
    source: queryWireSpecByLotNo.spec
outputs:
  - return_weight
result_cardinality: 0..1
sample_result:
  - return_weight: 120.5
