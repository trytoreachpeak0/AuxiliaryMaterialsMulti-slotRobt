id: app.slot.get_inventory
dialect: sqlite
datasource: app.sqlite
operation: read
business_meaning: 读取格口库存摘要，供 assume_empty / complete_issue_pickup 前判断是否为可用焊丝。
sql: |
  SELECT slot_id,
         slot_no,
         biz_state,
         wire_lot_no
  FROM app_slot
  WHERE slot_id = :slot_id;
params:
  - name: slot_id
outputs:
  - slot_id
  - slot_no
  - biz_state
  - wire_lot_no
result_cardinality: 0..1
