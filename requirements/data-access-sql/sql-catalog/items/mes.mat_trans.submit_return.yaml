id: mes.mat_trans.submit_return
title: 提交焊丝领用/归还事务（调用 FUN_MAT_TRANS_NEW）
system: MES
operation: write
dialect: oracle
risk_level: high
status: verified
datasource: mes.oracle.main
purpose: 调用 MES 存储函数 FWMES.FUN_MAT_TRANS_NEW，按 v_Task 区分焊丝领用或焊丝归还，写入物料转移事务并返回执行结果。
inputs:
  - name: V_Step
    type: string
    required: true
    source: 工序/步骤，例如焊线。
  - name: v_Task
    type: string
    required: true
    source: 任务类型；焊丝领用传“领用”，焊丝归还传归还流程对应任务值。
  - name: v_Eqp
    type: string
    required: true
    source: 机台号 machineNo。
  - name: v_Code
    type: string
    required: true
    source: 焊丝物料编码 wireCode。
  - name: v_Matlot
    type: string
    required: true
    source: 焊丝批号 wireBatch。
  - name: v_MatFromLot
    type: string
    required: true
    source: 来源物料批号 matFromLot。
  - name: v_Qty
    type: number
    required: true
    source: 事务数量；领用传 qty，归还传 returnQty。
  - name: v_Count
    type: number
    required: true
    source: 件数/计数，当前业务固定传 1。
  - name: v_PrdLot
    type: string
    required: true
    source: 产品批号 productLot。
  - name: v_PrdQty
    type: number
    required: true
    source: 产品数量；领用传 productQty，归还传 remainingQty。
  - name: V_ShelfLife
    type: string
    required: false
    source: 焊丝保质期 shelfLife；应用层须转为 yyyy-MM-dd HH:mm:ss（不依赖系统区域设置），再由 SQL TO_DATE 转 DATE；空值传 null 或空字符串。
  - name: V_Opr
    type: string
    required: true
    source: 操作员工号 operatorId。
  - name: V_Remark
    type: string
    required: false
    source: 备注；领用传空字符串，归还传 reason。
  - name: V_Workgroup
    type: string
    required: true
    source: 班组 workGroup。
  - name: V_Shift
    type: string
    required: true
    source: 班次 shift。
  - name: v_Writer
    type: string
    required: true
    source: 系统配置 Mes:MatTransWriter（写入人/设备标识，如「新厂前线物料多仓位2」）。
  - name: V_SESSION
    type: string
    required: false
    source: 会话标识，当前业务传空字符串。
outputs:
  - name: result
    type: string
    meaning: FUN_MAT_TRANS_NEW 返回结果；空字符串或 SUCCESS 为成功，其他非空文本为业务失败；匿名块或存储函数抛出的异常由应用层捕获。
sql: |
  DECLARE
    v_result VARCHAR2(4000);
  BEGIN
    v_result := FWMES.FUN_MAT_TRANS_NEW(
      :V_Step, :v_Task, :v_Eqp, :v_Code,
      :v_Matlot, :v_MatFromLot, :v_Qty, :v_Count,
      :v_PrdLot, :v_PrdQty, TO_DATE(:V_ShelfLife, 'YYYY-MM-DD HH24:MI:SS'), :V_Opr,
      :V_Remark, :V_Workgroup, :V_Shift, :v_Writer, :V_SESSION
    );
    :result := v_result;
  END;
result_cardinality: 1
outcomes:
  single:
    means: 取得存储函数返回的执行结果 result。
    action: 按 business_rule 判断成功或失败；成功则继续开格口/更新本地业务状态，失败则回滚本地事务并提示。
  error:
    means: 匿名块执行异常、数据库连接异常或应用侧事务回滚失败。
    action: 应用层回滚 Oracle 事务，将 SQLERRM 或连接错误原文提示给操作员，记录日志。
    severity: error
transaction:
  required: true
  idempotent: false
  affected_rows: 由 FWMES.FUN_MAT_TRANS_NEW 决定
  rollback_on: result 为非空且非 SUCCESS、匿名块/存储函数抛出异常、或应用侧捕获到数据库错误
  commit_on: result 为空或等于 SUCCESS
business_rule: |
  该 SQL 同时服务焊丝领用和焊丝归还，业务类型由 v_Task 决定。
  成功：result 为空字符串或精确等于 SUCCESS 时，应用层提交 Oracle 事务并继续流程。
  失败：result 为非空且不等于 SUCCESS 的任意文本时，应用层回滚 Oracle 事务，并将该文本原样提示操作员。
  异常：匿名块或 FWMES.FUN_MAT_TRANS_NEW 抛出异常时，不在 PL/SQL 内捕获；应用层回滚事务，并将 SQLERRM 原样提示操作员。
  焊丝领用：v_Task 默认“领用”；V_Remark 传空字符串；v_PrdQty 传 productQty。
  焊丝归还：v_Task 使用归还流程传入值；V_Remark 传 reason；v_Qty 传 returnQty；v_PrdQty 传 remainingQty。
  归还数量超限：SQLERRM 或 result 含「归还数量…不能大于产品待完工数量」时，应用层须回环步骤④（inputRemainingQty）重输剩余芯片并重新校验，不得直接终止流程。
usage_examples:
  wire_draw:
    meaning: 焊丝领用
    task_default: 领用
    qty_source: qty
    prd_qty_source: productQty
    remark_source: 空字符串
    success_result: 空字符串或 SUCCESS
  wire_return:
    meaning: 焊丝归还
    task_source: 归还流程传入 task
    qty_source: returnQty
    prd_qty_source: remainingQty
    remark_source: reason
    success_result: 空字符串或 SUCCESS
tables:
  - name: FWMES.FUN_MAT_TRANS_NEW
    type: function
    usage: MES 物料转移事务提交存储函数
interface:
  function_name: submitMatTrans
  params:
    - name: V_Step
      type: string
    - name: v_Task
      type: string
    - name: v_Eqp
      type: string
    - name: v_Code
      type: string
    - name: v_Matlot
      type: string
    - name: v_MatFromLot
      type: string
    - name: v_Qty
      type: number
    - name: v_Count
      type: number
    - name: v_PrdLot
      type: string
    - name: v_PrdQty
      type: number
    - name: V_ShelfLife
      type: string
    - name: V_Opr
      type: string
    - name: V_Remark
      type: string
    - name: V_Workgroup
      type: string
    - name: V_Shift
      type: string
    - name: v_Writer
      type: string
    - name: V_SESSION
      type: string
  returns: result (string) — 存储函数执行结果；空或 SUCCESS 为成功，其他非空文本为失败
aliases:
  - submitWireDraw
  - submitWireReturn
notes: |
  - v_Qty、v_Count、v_PrdQty 须以 Oracle NUMBER 绑定（OracleDbType.Decimal）；其余字符串参数绑定 Varchar2。
  - V_ShelfLife 应用层统一格式化为 yyyy-MM-dd HH:mm:ss（如 2026-11-04 00:00:00），忽略 Windows 区域设置；MES 读出的 M/d/yyyy 等格式会在提交前自动转换。
  - v_Writer 来自 appsettings Mes:MatTransWriter，不是 AGV 设备 Key。
  - 本 SQL 不在匿名块内使用 EXCEPTION 吞掉错误；由应用层开启 Oracle 事务，按 result 或异常决定 COMMIT/ROLLBACK。
  - V_ShelfLife 当前 SQL 使用 TO_DATE(:V_ShelfLife, 'YYYY-MM-DD HH24:MI:SS')；如果实际传入 "18-DEC-25" 这类 DD-MON-RR 格式，需要先在应用侧转换，或另行确认 MES 函数可接受的日期格式。
  - 现有 id 仍保留为 mes.mat_trans.submit_return，以兼容已有引用；语义上它已覆盖领用和归还两类物料转移。
