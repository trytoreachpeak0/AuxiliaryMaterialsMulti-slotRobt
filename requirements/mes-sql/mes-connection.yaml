# MES 数据库连接信息
# 安全提示：
# 1. 本文件包含数据库地址、账号、密码等敏感信息，禁止提交到公开仓库或外发。
# 2. 生产环境建议改用只读账号，并通过环境变量或密钥管理工具下发密码，不要长期明文保存。
# 3. 提供给 AI 访问时，建议只开放只读视图或专用查询账号，避免使用高权限账号。

version: 1
description: 焊丝发放相关 MES / 应用数据库连接信息。

connections:
  - id: mes.oracle.main
    title: MES 主库（Oracle）
    system: MES
    db_type: oracle
    dialect: oracle
    access: read            # read / write，AI 访问建议固定为 read
    env: production         # production / test / dev
    status: active

    # 连接基本信息（从连接字符串拆解，便于阅读和按环境替换）
    host: 172.19.1.152
    port: 1521
    service_name: SQMES
    protocol: TCP
    user: fwmes
    password: fwmes         # 敏感信息，建议改为环境变量引用，例如 ${MES_DB_PASSWORD}

    # 原始连接字符串（应用实际使用的形式）
    connection_string: >-
      Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=172.19.1.152)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=SQMES)));Persist Security Info=True;User ID=fwmes;Password=fwmes;

    notes: |
      - 该连接为 mes-sql-catalog.yaml 中 system=MES 的 SQL 所使用的数据库。
      - mes-sql-catalog.yaml 中的 SQL 已按 Oracle 方言编写（分页使用 FETCH FIRST ... ROWS ONLY，而非 TOP）。
