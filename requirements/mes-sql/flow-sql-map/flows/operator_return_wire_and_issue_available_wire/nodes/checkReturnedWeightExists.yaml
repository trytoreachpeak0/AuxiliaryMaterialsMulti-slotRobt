input_mappings:
  - name: return_weight
    source_node: queryWireReturnedWeightBySpec
    source_field: return_weight
    source_text: 应用数据库配置的该规格归还重量。
decision_rule:
  success_when:
    - condition: is_not_null_or_empty
      field: return_weight
      meaning: return_weight 非空时允许继续输入机台号。
  failure_when:
