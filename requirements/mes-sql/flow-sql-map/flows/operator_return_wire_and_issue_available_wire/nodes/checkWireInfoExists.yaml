node_id: checkWireInfoExists
node_text: 可用焊丝是否存在对应信息
access_type: decision
sql_ids: []
business_meaning: 判断 MES 是否返回可用焊丝领用事务所需的焊丝信息。
input_mappings:
  - name: wire_info
    source_node: queryWireByLotNo
    source_field: code/matlot/qty/shelflife
    source_text: MES 查询到的可用焊丝物料编码、主批次、数量和保质期。
decision_rule:
  success_when:
    - condition: exists
      field: wire_info
      meaning: 查询到可用焊丝信息时允许继续查询产品信息。
  failure_when:
    - condition: otherwise
      meaning: 未查询到可用焊丝信息时提示焊丝信息不存在。
outcome_routing:
  yes:
    next: queryProductByLotNo
  no:
    next: showWireInfoNotExists
