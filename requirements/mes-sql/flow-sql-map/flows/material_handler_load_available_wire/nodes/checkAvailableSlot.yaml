node_id: checkAvailableSlot
node_text: 发货柜是否有空闲格口
access_type: application_db
catalog_status: pending_catalog
sql_ids: []
business_meaning: 查询发货柜可用于存放可用焊丝的空闲格口，同时遵守预留归还格口规则，并判断是否允许继续存入。
input_mappings:
  - name: slot_usage_policy
    source_type: context
    source_field: slot_usage_policy
    source_text: 发货柜格口用途配置和预留规则。
  - name: slot_status
    source_type: application_db
    source_field: slot_status
    source_text: 当前格口占用、门状态和业务状态。
decision_rule:
  success_when:
    - condition: is_not_null_or_empty
      field: available_slot_id
      meaning: 查询到可用空闲格口时允许继续校验焊丝批号。
  failure_when:
    - condition: otherwise
      meaning: 没有符合预留规则的空闲格口时提示无空闲格口。
output_fields:
  - name: available_slot_id
    source_type: application_db
    source_text: 应用数据库选出的可用空闲格口。
outcome_routing:
  yes:
    next: queryWireSpecByLotNo
  no:
    next: showNoAvailableSlotMessage
  error:
    next: showNoAvailableSlotMessage
