node_id: queryWireSpecByLotNo
node_text: 查询 MES 数据库该批号对应的焊丝规格
access_type: mes_sql
sql_ids:
  - mes.wire.get_by_lot_no
business_meaning: 校验物料员录入的可用焊丝批号是否存在，并取得写入应用库存所需的焊丝信息。
input_mappings:
  - name: wire_lot_no
    source_node: inputAvailableWireLotNo
    source_field: available_wire_lot_no
    source_text: 物料员扫码录入或键盘输入可用焊丝批号。
outcome_routing:
  single:
    next: checkWireLotNoExists
  empty:
    next: checkWireLotNoExists
  multiple:
    next: showWireLotNoInputInvalidOrNotExistsMessage
    note: 同一批号多行属于数据异常，当前流程图复用批号错误提示。
  error:
    next: showWireLotNoInputInvalidOrNotExistsMessage
