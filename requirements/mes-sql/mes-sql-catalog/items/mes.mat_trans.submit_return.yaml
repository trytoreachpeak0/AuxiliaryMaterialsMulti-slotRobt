id: mes.mat_trans.submit_return
title: 提交焊丝领用/归还事务（调用 FUN_MAT_TRANS_NEW）
system: MES
operation: write
dialect: oracle
risk_level: high
status: verified
datasource: mes.oracle.main
purpose: 调用 MES 存储函数 FWMES.FUN_MAT_TRANS_NEW，按 v_Task 区分焊丝领用或焊丝归还，写入物料转移事务并返回执行结果。
inputs:
  - name: V_Step
    type: string
    required: true
    source: 工序/步骤，例如焊线。
  - name: v_Task
    type: string
    required: true
    source: 任务类型；焊丝领用传“领用”，焊丝归还传归还流程对应任务值。
  - name: v_Eqp
    type: string
    required: true
    source: 机台号 machineNo。
  - name: v_Code
    type: string
    required: true
    source: 焊丝物料编码 wireCode。
  - name: v_Matlot
    type: string
    required: true
    source: 焊丝批号 wireBatch。
  - name: v_MatFromLot
    type: string
    required: true
    source: 来源物料批号 matFromLot。
  - name: v_Qty
    type: string
    required: true
    source: 事务数量；领用传 qty，归还传 returnQty。
  - name: v_Count
    type: string
    required: true
    source: 件数/计数，当前业务固定传 "1"。
  - name: v_PrdLot
    type: string
    required: true
    source: 产品批号 productLot。
  - name: v_PrdQty
    type: string
    required: true
    source: 产品数量；领用传 productQty，归还传 remainingQty。
  - name: V_ShelfLife
    type: string
    required: false
    source: 焊丝保质期 shelfLife；SQL 中按 'YYYY-MM-DD HH24:MI:SS' 转 DATE，空值传 null 或空字符串。
  - name: V_Opr
    type: string
    required: true
    source: 操作员工号 operatorId。
  - name: V_Remark
    type: string
    required: false
    source: 备注；领用传空字符串，归还传 reason。
  - name: V_Workgroup
    type: string
    required: true
    source: 班组 workGroup。
  - name: V_Shift
    type: string
    required: true
    source: 班次 shift。
  - name: v_Writer
    type: string
    required: true
    source: 写入人/设备编号 agvNo。
  - name: V_SESSION
    type: string
    required: false
    source: 会话标识，当前业务传空字符串。
outputs:
  - name: result
    type: string
    meaning: FUN_MAT_TRANS_NEW 返回结果；空字符串或 SUCCESS 可按成功处理，ERROR/其他错误文本按失败处理。
sql: |
  DECLARE
    v_result VARCHAR2(4000);
  BEGIN
    BEGIN
      v_result := FWMES.FUN_MAT_TRANS_NEW(
        :V_Step, :v_Task, :v_Eqp, :v_Code,
        :v_Matlot, :v_MatFromLot, :v_Qty, :v_Count,
        :v_PrdLot, :v_PrdQty, TO_DATE(:V_ShelfLife, 'YYYY-MM-DD HH24:MI:SS'), :V_Opr,
        :V_Remark, :V_Workgroup, :V_Shift, :v_Writer, :V_SESSION
      );
    EXCEPTION
      WHEN OTHERS THEN
        v_result := 'ERROR: ' || SQLERRM;
    END;
    :result := v_result;
  END;
result_cardinality: 1
outcomes:
  single:
    means: 取得存储函数返回的执行结果 result。
    action: 按 business_rule 判断成功或失败；成功则继续开格口/更新本地业务状态，失败则回滚本地事务并提示。
  error:
    means: 匿名块执行异常、数据库连接异常或事务提交失败。
    action: 回滚本地事务，提示“提交焊丝领用/归还失败，请重试或联系管理员”，记录日志。
    severity: error
transaction:
  required: true
  idempotent: false
  affected_rows: 由 FWMES.FUN_MAT_TRANS_NEW 决定
  rollback_on: 存储函数返回失败、匿名块返回 ERROR 或应用侧抛出异常
business_rule: |
  该 SQL 同时服务焊丝领用和焊丝归还，业务类型由 v_Task 决定。
  焊丝领用参考 SubmitWireDraw：v_Task 默认“领用”；V_Remark 传空字符串；v_PrdQty 传 productQty；如果 result 为空、SUCCESS 或包含 ORA-01403，可按成功处理。
  焊丝归还参考 SubmitWireReturn：v_Task 使用归还流程传入值；V_Remark 传 reason；v_Qty 传 returnQty；v_PrdQty 传 remainingQty；result 为空时可按 SUCCESS 处理。
  除上述兼容口径外，返回 ERROR 或其他错误文本时应视为失败并提示。
usage_examples:
  wire_draw:
    meaning: 焊丝领用
    task_default: 领用
    qty_source: qty
    prd_qty_source: productQty
    remark_source: 空字符串
    success_result: 空字符串、SUCCESS、包含 ORA-01403
  wire_return:
    meaning: 焊丝归还
    task_source: 归还流程传入 task
    qty_source: returnQty
    prd_qty_source: remainingQty
    remark_source: reason
    success_result: 空字符串或 MES 返回成功标识
tables:
  - name: FWMES.FUN_MAT_TRANS_NEW
    type: function
    usage: MES 物料转移事务提交存储函数
interface:
  function_name: submitMatTrans
  params:
    - name: V_Step
      type: string
    - name: v_Task
      type: string
    - name: v_Eqp
      type: string
    - name: v_Code
      type: string
    - name: v_Matlot
      type: string
    - name: v_MatFromLot
      type: string
    - name: v_Qty
      type: string
    - name: v_Count
      type: string
    - name: v_PrdLot
      type: string
    - name: v_PrdQty
      type: string
    - name: V_ShelfLife
      type: string
    - name: V_Opr
      type: string
    - name: V_Remark
      type: string
    - name: V_Workgroup
      type: string
    - name: V_Shift
      type: string
    - name: v_Writer
      type: string
    - name: V_SESSION
      type: string
  returns: result (string) — 存储函数执行结果；空/SUCCESS/特定兼容错误可按业务成功处理
aliases:
  - submitWireDraw
  - submitWireReturn
notes: |
  - C# 调用里所有入参均按 OracleDbType.Varchar2 绑定，catalog 也按 string 记录，避免数量字段被误建成 integer。
  - 当前 SQL 在匿名块内部捕获存储函数异常并写入 result，便于应用侧统一按 result 判断。
  - V_ShelfLife 当前 SQL 使用 TO_DATE(:V_ShelfLife, 'YYYY-MM-DD HH24:MI:SS')；如果实际传入 "18-DEC-25" 这类 DD-MON-RR 格式，需要先在应用侧转换，或另行确认 MES 函数可接受的日期格式。
  - 现有 id 仍保留为 mes.mat_trans.submit_return，以兼容已有引用；语义上它已覆盖领用和归还两类物料转移。
