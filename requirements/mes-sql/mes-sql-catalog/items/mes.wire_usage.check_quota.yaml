id: mes.wire_usage.check_quota
title: 查询 MES 焊线用量并核对差值
system: MES
operation: read
dialect: oracle
risk_level: medium
status: draft
datasource: mes.oracle.main
flow_refs:
  - flow_id: op_return_old_wire_take_new_wire
    file: 焊丝发放流程图/操作员OP存废焊丝取新焊丝.md
    node_id: queryWireQuotaCheck
    node_text: 查询MES数据库焊线用量
purpose: 调用 MES 存储函数 Get_Mat_QuotaCheck 进行焊线用量配额核对，返回核对结果码，供业务判断是否允许提交焊丝退还请求。
inputs:
  - name: V_STEP
    type: string
    required: true
    source: 工序/步骤（如 焊线）
  - name: V_MatLot
    type: string
    required: true
    source: 物料批号（焊丝批号）
  - name: V_thzl
    type: string
    required: true
    source: 退还重量
  - name: V_thph
    type: string
    required: true
    source: 退还批号
  - name: V_sycl
    type: integer
    required: true
    source: 剩余待焊芯片数量
  - name: V_eqp
    type: string
    required: true
    source: 机台号
outputs:
  - name: result
    type: integer
    meaning: 真实用量与预计用量的差值（恒 >= 0），由存储函数 Get_Mat_QuotaCheck 计算返回
sql: |
  DECLARE
    v_result NUMBER;
  BEGIN
    v_result := Get_Mat_QuotaCheck(
      :V_STEP, :V_MatLot, :V_thzl,
      :V_thph, :V_sycl, :V_eqp
    );
    :result := v_result;
  END;
result_cardinality: 1
outcomes:
  single:
    means: 取得真实用量与预计用量的差值 result。
    action: 按 business_rule 比较 result 与阈值，决定是否允许提交焊丝退还请求。
  error:
    means: 数据库异常、存储函数报错或查询超时。
    action: 提示“系统繁忙，请稍后重试”，记录日志。
    severity: error
business_rule: |
  result 为真实用量与预计用量的差值（integer，恒 >= 0）。
  result < 500 时允许继续提交焊丝退还请求；result >= 500 说明用量偏差过大，禁止放行，转人工处理。
  差值由存储函数 Get_Mat_QuotaCheck 计算返回，应用侧只负责与阈值 500 比较。
tables:
  - name: Get_Mat_QuotaCheck
    type: function
    usage: MES 焊线用量配额核对存储函数
interface:
  function_name: checkMatQuota
  params:
    - name: V_STEP
      type: string
    - name: V_MatLot
      type: string
    - name: V_thzl
      type: string
    - name: V_thph
      type: string
    - name: V_sycl
      type: string
    - name: V_eqp
      type: string
  returns: result (integer) — 真实用量与预计用量的差值（恒 >= 0）
notes: |
  - 这是调用 Oracle 存储函数的 PL/SQL 匿名块，:result 为输出（OUT）绑定变量，需在应用层注册为输出参数。
  - 入参 V_thzl / V_thph / V_sycl 的业务含义待与 MES 确认后补全各自的 meaning。
  - result 是 integer（用量差值），不是枚举，无需登记到 mes-schema.yaml 的 enums。
