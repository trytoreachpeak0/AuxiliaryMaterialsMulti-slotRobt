# 合并视图（自动生成，请勿直接编辑）
# 请改 mes-schema/tables|enums/ 下文件，再执行：cd _tools && npm run merge
version: 1
description: 焊丝发放相关表/视图结构与数据字典。
datasources:
  - id: mes.oracle.main
    ref: mes-connection.yaml -> connections[id=mes.oracle.main]
tables:
  - name: mv_fw_username
    datasource: mes.oracle.main
    type: view
    comment: 操作员工号与姓名映射
    columns:
      - name: usercode
        type: VARCHAR2
        length: 50
        nullable: true
        is_key: true
        comment: 操作人员工号
      - name: username
        type: VARCHAR2
        length: 200
        nullable: true
        is_key: false
        comment: 操作人员姓名
    notes: 需与 MES 确认 usercode 是否唯一；若底层多表 JOIN，可能出现同工号多行。
  - name: v_fw_material_indetail
    datasource: mes.oracle.main
    type: view
    comment: 物料批号与物料数据映射
    columns:
      - name: sublot
        type: VARCHAR2
        length: 45
        nullable: false
        is_key: true
        comment: 物料子批号
      - name: spec
        type: VARCHAR2
        length: 100
        nullable: true
        is_key: false
        comment: 物料规格
      - name: type
        type: VARCHAR2
        length: 50
        nullable: true
        is_key: false
        comment: 物料类型
      - name: code
        type: VARCHAR2
        length: 50
        nullable: true
        is_key: false
        comment: 物料类型
      - name: shelflife
        type: DATE
        nullable: true
        is_key: false
        comment: 保质期
      - name: matlot
        type: VARCHAR2
        length: 45
        nullable: true
        is_key: true
        comment: 物料主批号
      - name: qty
        type: NUMBER
        nullable: false
        is_key: false
        comment: 物料数量
      - name: state
        type: VARCHAR2
        length: 45
        nullable: true
        is_key: false
        comment: 物料状态
  - name: fw_eqpres_eqpinformation
    datasource: mes.oracle.main
    type: table
    comment: 查询机台信息
    columns:
      - name: eqpno
        type: VARCHAR2
        length: 30 Byte
        nullable: false
        is_key: true
        comment: 机台号
      - name: step
        type: VARCHAR2
        length: 20 Byte
        nullable: false
        is_key: false
        comment: 所处工艺的步骤
enums:
  - field: state
    applies_to:
      - v_fw_material_indetail.state
    db_type: VARCHAR2(45)
    values:
      - value: 上机
      - value: 关闭
      - value: 归还
      - value: 冷藏
      - value: 报废
      - value: 可用
