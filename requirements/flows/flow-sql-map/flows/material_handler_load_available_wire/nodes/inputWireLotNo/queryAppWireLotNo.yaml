subgraph_id: inputWireLotNo
node_id: queryAppWireLotNo
node_text: 查询应用数据库该批号是否已绑定格口
access_type: application_db
catalog_status: pending_catalog
sql_ids:
  - app.slot.find_by_wire_lot_no
business_meaning: 校验物料员录入的可用焊丝批号是否已在柜内占用，避免重复绑定。
output_fields:
  - name: slot_id
    source_type: sql_catalog
    source_ref: app.slot.find_by_wire_lot_no
    catalog_field: slot_id
    source_text: 已绑定该批号的格口 ID。
  - name: slot_no
    source_type: sql_catalog
    source_ref: app.slot.find_by_wire_lot_no
    catalog_field: slot_no
    source_text: 已绑定该批号的格口编号。
  - name: biz_state
    source_type: sql_catalog
    source_ref: app.slot.find_by_wire_lot_no
    catalog_field: biz_state
    source_text: 已绑定格口的业务状态。
input_mappings:
  - name: wire_lot_no
    source_node: inputAvailableWireLotNo
    source_field: available_wire_lot_no
    source_text: 物料员扫码录入或键盘输入可用焊丝批号。
outcome_routing:
  single:
    next: checkAppWireLotNoAlreadyExists
  empty:
    next: checkAppWireLotNoAlreadyExists
  multiple:
    next: showWireLotNoAlreadyInCabinetMessage
    note: 同一批号绑定多格属于数据异常，按重复录入处理。
  error:
    next: showWireLotNoAlreadyInCabinetMessage
