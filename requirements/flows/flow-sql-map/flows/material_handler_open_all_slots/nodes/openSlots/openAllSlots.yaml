subgraph_id: openSlots
node_id: openAllSlots
node_text: 打开所有格口
access_type: application_db_and_slot_control
catalog_status: pending_catalog
sql_ids: []
business_meaning: 查询全部可控格口并下发批量开门指令。
output_fields:
  - name: slot_id
    source_type: sql_catalog
    source_ref: app.slot.list_by_filter
    catalog_field: slot_id
    source_text: 待打开格口 ID（批量时多行）。
  - name: slot_no
    source_type: sql_catalog
    source_ref: app.slot.list_by_filter
    catalog_field: slot_no
    source_text: 格口编号。
  - name: biz_state
    source_type: sql_catalog
    source_ref: app.slot.list_by_filter
    catalog_field: biz_state
    source_text: 业务状态。
  - name: door_state
    source_type: sql_catalog
    source_ref: app.slot.list_by_filter
    catalog_field: door_state
    source_text: 门状态。
  - name: slot_ids
    source_type: runtime
    source_text: 批量开门后的格口 ID 列表，供 updateAllSlots 使用。
input_mappings:
  - name: slot_filter
    source_type: constant
    value: all_slots
    source_text: 所有发货柜格口。
outcome_routing:
  success:
    next: updateAllSlots
  error:
    next: End
    note: 流程图未单列失败节点，实现时应提示开门失败并记录日志。
