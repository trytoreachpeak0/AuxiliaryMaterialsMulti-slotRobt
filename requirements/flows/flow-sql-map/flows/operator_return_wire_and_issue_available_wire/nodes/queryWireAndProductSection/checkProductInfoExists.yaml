subgraph_id: queryWireAndProductSection
node_id: checkProductInfoExists
node_text: 产品信息是否存在
access_type: decision
sql_ids: []
business_meaning: 判断产品批次未关闭子批数量和工序是否有效，供焊丝领用事务使用。
input_mappings:
  - name: qty
    source_node: queryProductByLotNo
    source_field: qty
    source_text: 产品批次未关闭子批数量合计。
  - name: step
    source_node: queryProductByLotNo
    source_field: step
    source_text: 产品批次当前工序。
decision_rule:
  operator: all
  success_when:
    - condition: is_not_null_or_empty
      field: qty
      meaning: qty 非空时认为存在未关闭子批数量。
    - condition: is_not_null_or_empty
      field: step
      meaning: step 非空时认为存在有效产品工序。
  failure_when:
    - condition: otherwise
      meaning: qty 或 step 为空时提示产品信息不存在。
outcome_routing:
  yes:
    next: submitWireIssue
  no:
    next: showCheckProductInfoNotExistsMessage
