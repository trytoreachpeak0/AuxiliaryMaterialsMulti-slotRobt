node_id: checkSubmitWireIssueSuccess
node_text: 焊丝领用是否成功
access_type: decision
sql_ids: []
business_meaning: 根据 MES 焊丝领用函数返回的 result 判断领用提交是否成功。
input_mappings:
  - name: result
    source_node: submitWireIssue
    source_field: result
    source_text: FWMES.FUN_MAT_TRANS_NEW 的输出参数 result。
decision_rule:
  result_field: result
  normalized_success_value: SUCCESS
  success_when:
    - condition: is_null_or_empty
      meaning: result 为空或 null 时按成功处理。
    - condition: equals
      value: SUCCESS
      meaning: result 等于 SUCCESS 时按成功处理。
    - condition: contains
      value: ORA-01403
      meaning: 忽略 NO_DATA_FOUND；result 包含 ORA-01403 时按成功处理。
  failure_when:
    - condition: otherwise
      meaning: 其他非空返回文本按失败原因处理并提示。
outcome_routing:
  yes:
    next: showWireIssueSuccessMessage
  no:
    next: showWireIssueFailMessage
