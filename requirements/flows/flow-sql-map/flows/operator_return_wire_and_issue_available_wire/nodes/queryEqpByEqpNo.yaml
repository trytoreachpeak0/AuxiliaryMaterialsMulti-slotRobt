node_id: queryEqpByEqpNo
node_text: 查询 MES 数据库该机台号对应机台
access_type: mes_sql
sql_ids:
  - mes.eqp.get_by_wire_bonding_eqp_no
business_meaning: 校验操作员输入的焊线机台号是否存在。
input_mappings:
  - name: eqp_no
    source_node: inputEqpNo
    source_field: eqp_no
    source_text: 操作员输入机台号。
outcome_routing:
  single:
    next: checkEqpNoExists
  empty:
    next: checkEqpNoExists
  multiple:
    next: showEqpNoNotExistsMessage
    note: 同一机台多行属于数据异常，当前流程图复用机台不存在提示。
  error:
    next: showEqpNoNotExistsMessage
