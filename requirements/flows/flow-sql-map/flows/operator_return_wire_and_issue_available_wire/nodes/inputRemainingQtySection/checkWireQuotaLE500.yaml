    source_node: queryWireQuotaCheck
    source_field: result
    source_text: Get_Mat_QuotaCheck 返回的真实用量与预计用量差值。
decision_rule:
  success_when:
    - condition: less_than_or_equal
      field: quota_diff
      value: 500
      meaning: 差值小于等于 500 颗时允许提交归还请求。
  failure_when:
    - condition: greater_than
      field: quota_diff
      value: 500
      meaning: 差值大于 500 颗时提示剩余待焊芯片数量不正确。
outcome_routing:
