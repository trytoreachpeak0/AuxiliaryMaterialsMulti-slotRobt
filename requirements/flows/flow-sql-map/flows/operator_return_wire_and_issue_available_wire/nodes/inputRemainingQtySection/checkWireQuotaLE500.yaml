subgraph_id: inputRemainingQtySection
node_id: checkWireQuotaLE500
node_text: 焊丝用量实际值与预计值差值是否小于等于 500 颗
access_type: decision
sql_ids: []
business_meaning: 判断 MES 用量核对函数返回的差值是否在允许阈值内。
