subgraph_id: loadReturnedWireSection
node_id: openReturnSlot
node_text: 发货柜打开归还格口
access_type: application_db_and_slot_control
catalog_status: pending_catalog
sql_ids: []
business_meaning: 对步骤②已预分配的归还格口（findReturnSlot）下发开门指令并落库 door=open。
output_fields:
  - name: opened_slot_id
    source_type: sql_catalog
    source_ref: app.slot.open
    catalog_field: opened_slot_id
    source_text: 已打开的归还格口 ID。
input_mappings:
  - name: slot_id
    source_node: findReturnSlot
    source_field: return_slot_id
    source_text: 归还目标格口。
outcome_routing:
  success:
    next: showLoadWireAndCloseDoorMessage
  error:
    next: showOpenReturnSlotFailedMessage
    note: 已预分配归还格口但开门指令失败（硬件/通信等），与 findReturnSlot 无空闲格口区分。
