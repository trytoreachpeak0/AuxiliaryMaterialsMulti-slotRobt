  - name: wire_code
    source_node: queryWireSpecByLotNo
    source_field: code
    source_text: 归还焊丝物料编码。
  - name: shelflife
    source_node: queryWireSpecByLotNo
    source_field: shelflife
    source_text: 保质期。
  - name: matlot
    source_node: queryWireSpecByLotNo
    source_field: matlot
    source_text: 主批次。
  - name: qty
    source_node: queryWireSpecByLotNo
    source_field: qty
    source_text: 数量。
  - name: wire_state
    source_node: queryWireSpecByLotNo
    source_field: state
