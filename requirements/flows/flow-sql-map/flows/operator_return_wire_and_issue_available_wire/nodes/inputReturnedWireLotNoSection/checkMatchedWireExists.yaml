subgraph_id: inputReturnedWireLotNoSection
node_id: checkMatchedWireExists
node_text: 发货柜内是否有匹配的同规格可用焊丝
access_type: decision
sql_ids: []
business_meaning: 判断应用数据库是否查到同规格可用焊丝；查到则预分配归还格口，未查到则提示到物料间领取。
input_mappings:
  - name: matched_available_wire_lot_no
    source_node: queryMatchedAvailableWire
    source_field: matched_available_wire_lot_no
    source_text: 应用数据库查到的同规格可用焊丝批号。
decision_rule:
  success_when:
    - condition: is_not_null_or_empty
      field: matched_available_wire_lot_no
      meaning: 匹配焊丝批号非空时认为有可用焊丝。
  failure_when:
    - condition: otherwise
      meaning: 未匹配到可用焊丝时提示到物料间领取。
outcome_routing:
  yes:
    next: findReturnSlot
  no:
    next: showNoMatchedWireMessage
