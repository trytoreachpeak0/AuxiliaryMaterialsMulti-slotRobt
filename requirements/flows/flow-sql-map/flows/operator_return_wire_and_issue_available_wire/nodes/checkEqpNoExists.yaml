node_id: checkEqpNoExists
node_text: 该机台是否存在
access_type: decision
sql_ids: []
business_meaning: 根据 MES 机台查询结果判断操作员输入的机台号是否存在。
input_mappings:
  - name: eqp_record
    source_node: queryEqpByEqpNo
    source_field: eqp_no
    source_text: MES 查询到的机台记录。
decision_rule:
  success_when:
    - condition: exists
      field: eqp_record
      meaning: 查询到唯一机台记录时认为机台存在。
  failure_when:
    - condition: otherwise
      meaning: 未查询到机台记录时提示不存在该机台号。
outcome_routing:
  yes:
    next: queryLastProductLotNo
  no:
    next: showEqpNoNotExistsMessage
