subgraph_id: submitWireReturnSection
node_id: submitWireReturn
node_text: 提交焊丝归还请求
access_type: mes_function
sql_ids:
  - mes.mat_trans.submit_return
business_meaning: 调用 FWMES.FUN_MAT_TRANS_NEW 提交焊丝归还事务。
output_fields:
  - name: result
    source_type: sql_catalog
    source_ref: mes.mat_trans.submit_return
    catalog_field: result
    source_text: MES 归还事务返回结果；空或 SUCCESS 为成功。
input_mappings:
  - name: V_Step
    source_type: constant
    value: 焊线
    source_text: 工序，当前流程固定为“焊线”。
  - name: v_Task
    source_type: context
    source_field: return_task
    source_text: 归还流程任务类型，按 MES 约定传入。
  - name: v_Eqp
    source_node: inputEqpNo
    source_field: eqp_no
    source_text: 操作员输入并校验通过的机台号。
  - name: v_Code
    source_node: queryWireSpecByLotNo
    source_field: code
    source_text: 归还焊丝物料编码。
  - name: v_Matlot
    source_node: inputReturnedWireLotNo
    source_field: returned_wire_lot_no
    source_text: 归还焊丝批号。
  - name: v_MatFromLot
    source_node: queryWireSpecByLotNo
    source_field: matlot
    source_text: 归还焊丝主批次。
  - name: v_Qty
    source_node: queryWireReturnedWeightBySpec
    source_field: return_weight
    source_text: 归还数量/重量。
  - name: v_Count
    source_type: constant
    value: "1"
    source_text: 当前业务固定传 "1"。
  - name: v_PrdLot
    source_node: queryLastProductLotNo
    source_field: lot
    source_text: 机台最近生产产品批号。
  - name: v_PrdQty
    source_node: inputRemainingQty
    source_field: remaining_qty
    source_text: 操作员输入产品剩余待焊芯片数量。
  - name: V_ShelfLife
    source_node: queryWireSpecByLotNo
    source_field: shelflife
    source_text: 归还焊丝保质期。
  - name: V_Opr
    source_node: inputOperatorWorkInfo
    source_field: operator_id
    source_text: 操作员工号。
  - name: V_Remark
    source_type: context
    source_field: return_remark
    source_text: 归还备注或原因；流程图未单独建输入节点时可为空。
  - name: V_Workgroup
    source_node: inputOperatorWorkInfo
    source_field: work_group
    source_text: 操作员输入班组。
  - name: V_Shift
    source_node: inputOperatorWorkInfo
    source_field: shift
    source_text: 操作员输入班次。
  - name: v_Writer
    source_type: system_parameter
    source_field: configured_agv_no
    source_text: 系统配置的 AGV/设备编号；不是数据库查询结果，也不是用户输入。
  - name: V_SESSION
    source_type: constant
    value: ""
    source_text: 会话标识，当前业务可传空字符串。
outcome_routing:
  single:
    next: checkSubmitWireReturnSuccess
  error:
    next: showWireReturnFailMessage
