subgraph_id: submitWireReturnSection
node_id: checkSubmitWireReturnSuccess
node_text: 焊丝归还是否成功
access_type: decision
sql_ids: []
business_meaning: 根据 MES 焊丝归还函数返回的 result 判断归还提交是否成功。
input_mappings:
  - name: result
    source_node: submitWireReturn
    source_field: result
    source_text: FWMES.FUN_MAT_TRANS_NEW 的输出参数 result。
decision_rule:
  result_field: result
  normalized_result:
    null_value: SUCCESS
    non_null_value: original_string
    source_text: 对应代码 `resultParam.Value != null ? resultParam.Value.ToString() : "SUCCESS"`。
  success_when:
    - condition: equals_after_normalize
      value: SUCCESS
      meaning: 只有输出参数为 null，或 MES 明确返回 SUCCESS 时，按成功处理。
  failure_when:
    - condition: otherwise
      meaning: 其他非空返回文本按失败原因处理并提示。
outcome_routing:
  yes:
    next: showWireReturnSuccessMessage
  no:
    next: showWireReturnFailMessage
