subgraph_id: inputIssueProductLotNoSection
node_id: inputIssueProductLotNo
node_text: 操作员手动输入领用工单批次号
access_type: user_input
sql_ids: []
business_meaning: >
  领用焊丝对应的工单批次号，须由操作员手动输入；不得由步骤 1.2.5（queryLastProductLotNo，归还用机台最近生产批次号）
  自动带入或预填。归还批次号与领用批次号相互独立，二者可能相同也可能不同，供后续 queryProductByLotNo /
  submitWireIssue 使用。
output_fields:
  - name: issue_product_lot_no
    source_type: ui_input
    source_text: 操作员手动输入的领用工单批次号，不可复用归还批次号自动填充。
outcome_routing:
  success:
    next: queryProductByLotNo
