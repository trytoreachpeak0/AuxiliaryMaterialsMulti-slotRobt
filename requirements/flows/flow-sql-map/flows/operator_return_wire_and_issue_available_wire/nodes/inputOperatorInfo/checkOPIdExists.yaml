subgraph_id: inputOperatorInfo
node_id: checkOPIdExists
node_text: 是否存在该操作人员
access_type: decision
sql_ids: []
business_meaning: 根据操作员工号查询结果判断操作员是否存在。
input_mappings:
  - name: operator_record
    source_node: queryOPById
    source_field: operator_name
    source_text: MES 查询到的操作员姓名；存在记录时非空。
decision_rule:
  success_when:
    - condition: exists
      field: operator_record
      meaning: 查询到唯一操作员记录时认为操作员存在。
  failure_when:
    - condition: otherwise
      meaning: 未查询到或查询异常时提示不存在该操作人员。
outcome_routing:
  yes:
    next: showOPName
  no:
    next: showOPIdNotExistsMessage
