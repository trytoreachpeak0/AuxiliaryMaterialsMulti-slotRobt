name: v_fw_wip_sublot
kind: table
dialect: sqlite
mirrors: v_fw_wip_sublot (Oracle view)
description: MES 在制品子批 mock 表，按产品批号聚合数量与工序。
columns:
  - { name: lot, type: TEXT, description: 产品批号 }
  - { name: qty, type: REAL, description: 数量 }
  - { name: step, type: TEXT, description: 工序 }
  - { name: state, type: TEXT, description: 状态，关闭 表示已结案 }
