id: app.slot.find_return_slot
dialect: sqlite
datasource: app.sqlite
operation: read
business_meaning: >-
  操作员归还焊丝前，查找一个可用于存放归还焊丝的空闲格口（usage_type 为 returned 或 shared，biz_state=idle，门已关）。
sql: |
  SELECT slot_id AS return_slot_id,
         slot_no AS return_slot_no
  FROM app_slot
  WHERE usage_type IN ('returned', 'shared')
    AND biz_state = 'idle'
    AND door_state = 'closed'
  ORDER BY slot_no
  LIMIT 1;
params: []
outputs:
  - return_slot_id
  - return_slot_no
result_cardinality: 0..1
sample_result:
  - return_slot_id: 6
    return_slot_no: A06
