id: mes_mock.wire_quota.check_quota
mirrors: mes.wire_quota.check_quota
dialect: sqlite
datasource: mes.mock.sqlite
operation: function
business_meaning: >-
  调用 MES 存储函数 Get_Mat_QuotaCheck 核对焊丝用量配额，返回实际与理论消耗差值（米）。
  成功返回任意数值即校验通过；ORA-20007 表示校验不通过。
mock:
  kind: configurable_number
  result_field: quota_diff
  source: 由界面「MES 函数 mock 结果」面板配置（默认 0）。
oracle_sql: |
  DECLARE
    v_result NUMBER;
  BEGIN
    v_result := Get_Mat_QuotaCheck(
      :V_STEP, :V_MatLot, :V_thzl,
      :V_thph, :V_sycl, :V_eqp
    );
    :result := v_result;
  END;
params:
  - { name: V_STEP, source_type: constant, value: 焊线 }
  - { name: V_MatLot, source: inputReturnedWireLotNo.returned_wire_lot_no }
  - { name: V_thzl, source: queryWireReturnedWeightBySpec.return_weight, type: string }
  - { name: V_thph, source: queryLastProductLotNo.lot }
  - { name: V_sycl, source: inputRemainingQty.remaining_qty, type: number }
  - { name: V_eqp, source: inputEqpNo.eqp_no }
outputs:
  - quota_diff
result_cardinality: 1
business_rule: 成功返回任意 quota_diff（米）即允许提交归还；ORA-20007 时提示数量有误并重输。
